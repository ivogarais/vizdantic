[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizdantic"
description = "Visualistion validation using Pydantic for ai agents"
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.uv]
required-version = ">=0.8.0"
